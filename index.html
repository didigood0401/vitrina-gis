<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Витрина данных по строительству</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f0;--pn:#fff;--tn:#e3e8e6;--ink:#17242b;--mut:#51616a;--acc:#0c6b5f;--warn:#a84a12;--warnbg:#fbeadd}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:400 15px/1.45 "IBM Plex Sans",Arial,sans-serif;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 16px;background:var(--ink);color:#fff;flex-wrap:wrap}
.bar h1{font-size:17px;font-weight:600}
.bar span{font-size:13px;color:#b9c7c4}
.src{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;align-items:center}
.src b{font-weight:500;font-size:13px;color:var(--mut);margin-right:4px}
.src button{min-height:40px;padding:0 12px;border:0;background:var(--tn);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:7px;border-radius:3px;transition:background .2s,color .2s,transform .2s}
.src button:active{transform:scale(.97)}
.src button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.src button[aria-pressed=false]{background:none;color:var(--mut);text-decoration:line-through}
.src button[aria-pressed=false] i{background:#aab5b2}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--tn);margin:0 16px}
.kpi div{background:var(--pn);padding:10px 14px}
.kpi b{display:block;font-size:24px;font-weight:600;line-height:1.15}
.kpi span{font-size:13px;color:var(--mut)}
.kpi .w b{color:var(--warn)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 400px;gap:10px;padding:10px 16px 16px;height:calc(100vh - 186px);min-height:560px}
.pn{background:var(--pn);border-radius:3px;overflow:auto}
.ls button{display:block;width:100%;text-align:left;padding:10px 13px;border:0;background:none;cursor:pointer;border-left:3px solid transparent;transition:background .2s}
.ls button:hover{background:var(--bg)}
.ls button[aria-selected=true]{background:#dcece8;border-left-color:var(--acc)}
.ls b{display:block;font-weight:500}
.ls small{font-size:13px;color:var(--mut)}
.ls em{font-style:normal;font-size:13px;color:var(--warn);font-weight:500}
#v{position:relative;background:#dfe6e4;border-radius:3px;overflow:hidden}
canvas{display:block;width:100%;height:100%}
.tag{position:absolute;left:12px;bottom:12px;background:var(--pn);padding:7px 11px;border-radius:3px;font-size:13px;pointer-events:none}
.cd{padding:14px 16px}
.cd h2{font-size:19px;font-weight:600;line-height:1.2}
.cd .kn{font-size:13px;color:var(--mut);margin-top:2px}
.st{margin:12px 0 4px;height:6px;background:var(--tn);overflow:hidden}
.st i{display:block;height:100%;background:var(--acc);width:0;transition:width .7s cubic-bezier(.22,1,.36,1)}
.stl{font-size:13px;color:var(--mut)}
.alert{margin-top:10px;background:var(--warnbg);color:var(--warn);padding:9px 11px;font-size:14px;font-weight:500}
table{border-collapse:collapse;width:100%;margin-top:10px}
th{font-size:13px;font-weight:600;text-align:left;padding:11px 0 4px;color:var(--ink)}
th i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
td{padding:4px 0;border-bottom:1px solid var(--tn);font-size:14px;vertical-align:top}
td:first-child{color:var(--mut);width:46%;padding-right:10px}
td.no{color:#7a8a86}
td.bad{color:var(--warn);font-weight:500}
.fade{animation:f .4s ease both}
@keyframes f{from{opacity:0;transform:translateY(6px)}}
.exp{margin-top:14px;min-height:42px;padding:0 15px;background:var(--acc);color:#fff;border:0;border-radius:3px;font-weight:500;cursor:pointer;transition:background .2s}
.exp:hover{background:#094f46}
.note{padding:0 16px 14px;font-size:13px;color:var(--mut)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
@media(max-width:1020px){.app{grid-template-columns:1fr;height:auto}#v{height:46vh;min-height:300px;order:-1}.ls{display:flex;overflow-x:auto}.ls button{flex:none;width:210px;border-left:0;border-bottom:3px solid transparent}.ls button[aria-selected=true]{border-bottom-color:var(--acc)}.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
